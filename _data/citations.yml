  abstract: A method for incrementally updating a reordering model in a statistical machine translation system. The process involves extracting phrase pairs from new training data to generate a new reordering file, then merging this with existing data to update the model. This approach allows for faster, more frequent updates compared to retraining from scratch, enabling the SMT system to be kept up-to-date with the most recent data. The system uses an RM update component to generate an updated reordering table while maintaining feature scores for orientation types and incorporating new counts.
