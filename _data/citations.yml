  abstract: An authoring system assists users in composing source language text by providing real-time suggestions to improve translatability into a target language. The system uses a suggestion model that evaluates candidate phrases based on translatability scores derived from statistical machine translation biphrase tables. The process is iterative users select suggested completions to build the source text, which is then translated by an SMT decoder. This technology enables monolinguals to author texts that can be reliably translated without requiring post-editing by bilinguals.
