  abstract: A method for identifying an optimal machine translation system for a user using a collaborative filtering approach. The system maintains user profiles containing pairwise rankings of various translation systems. To predict the best system for a specific user, it identifies nearest neighbors who share similar translation preferences based on existing rankings. If data is missing for a user, the system fills these gaps by computing weighted averages of the rankings provided by these nearest neighbors. This updated profile then determines the optimal translation system to use, providing personalized machine translation recommendations.
