- authors: Aziz, Wilker; Dymetman, Marc; Specia, Lucia; Mirkin, Shachar
  title: 'Learning an expert from human annotations in statistical machine translation: The case of out-of-vocabulary words'
  publication: Proceedings of the 14th Annual Conference of the European Association for Machine Translation
  url: https://aclanthology.org/2010.eamt-1.31/
  pdf: https://aclanthology.org/2010.eamt-1.31.pdf
  year: 2010
  abstract: We present a general method for incorporating an “expert ” model into a Statistical Machine Translation (SMT) system, in order to improve its performance on a particular “area of expertise”, and apply this method to the specific task of finding adequate replacements for Out-of-Vocabulary (OOV) words. Candidate replacements are paraphrases and entailed phrases, obtained using monolingual resources. These candidate replacements are transformed into “dynamic biphrases”, generated at decoding time based on the context of each source sentence. Standard SMT features are enhanced with a number of new features aimed at scoring translations produced by using different replacements. Active learning is used to discriminatively train the model parameters from human assessments of the quality of translations. The learning framework yields an SMT system which is able to deal with sentences containing OOV words but also guarantees that the performance is not degraded for input sentences without
    OOV words. Results of experiments on English-French translation show that this method outperforms previous work addressing OOV words in terms of acceptability. 1
  citation_link: https://aclanthology.org/2010.eamt-1.31/
