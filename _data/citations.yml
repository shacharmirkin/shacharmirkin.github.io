- authors: Mirkin, Shachar
  title: Context and Discourse in Textual Entailment Inference
  publication: PhD Thesis
  year: 2011
  publisher: Bar-Ilan University
  abstract: This thesis addresses applied semantic inference within the Textual Entailment framework, focusing on context and discourse aspects of inference. It demonstrates that standard textual entailment systems rely too heavily on limited coreference resolution, and shows that incorporating broader discourse phenomena, such as bridging relations and verbal references, significantly improves entailment performance. The work explores using discourse references to complement existing entailment knowledge and rules, providing empirical evidence that discourse provides useful information for improved inference systems.
