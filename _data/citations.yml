  abstract: A method and system for improving machine translation quality by automatically rewriting source sentences using confidence estimation. The system identifies sentences likely to be poorly translated and suggests alternative phrasings to a monolingual user. Source modifications are induced by confidence estimates derived from the translation model in use. Modifications are automatically generated and proposed for the user's approval. This approach reduces post-editing effort by replacing it with cost-effective pre-editing that can be performed by monolinguals.
