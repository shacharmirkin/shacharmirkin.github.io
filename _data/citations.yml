- authors: Mirkin, Shachar; Venkatapathy, Sriram; Dymetman, Marc
  title: Confidence-driven Rewriting for Improved Translation
  publication: MT Summit
  url: https://aclanthology.org/2013.mtsummit-posters.8/
  pdf: https://aclanthology.org/2013.mtsummit-posters.8.pdf
  year: 2013
  abstract: Some source texts are more difficult to translate than others. One way to handle such texts is to modify them prior to translation. Yet, a prominent factor that is often overlooked is the source translatability with respect to the specific translation system and the specific model that are being used. We present an approach, and an interactive tool implementing it, where source sentences are rewritten in order to maximize confidence estimates with respect to the translation model. The automatically-generated rewritings are then proposed for the user's approval. Such an approach can reduce post-editing effort, replacing it by cost-effective pre-editing that can be done by monolinguals.
