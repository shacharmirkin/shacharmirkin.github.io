# Site settings
title: Shachar Mirkin
description: Personal website of Shachar Mirkin — applied AI research, NLP, snippets, and contact.
baseurl: ""
url: "https://alpinf.com"
lang: en
# Search Console ownership for https://shacharmirkin.github.io/ (jekyll-seo-tag → meta).
webmaster_verifications:
  google: uJZSBchBz-jktnQEadRylNmBaGh4zq7Bz-B5SAXO614
# Default OG / Twitter image (jekyll-seo-tag).
logo: /assets/images/alpinf-logo.jpg

company:
  name: Alpinf
  legal_name: Alpinference
  icon: /assets/images/alpinf-logo-noname.png
  logo: /assets/images/alpinf-logo.jpg
  # Named lockup (ALPINF); non-linked round nav mark.
  mark: /assets/images/alpinf-logo.jpg

# Read-aloud (Web Speech API). voice_name: substring match on OS voices (e.g. Samantha, Daniel).
# Per-post overrides: read_aloud_voice, read_aloud_rate, read_aloud_pitch in front matter.
read_aloud:
  rate: 1
  pitch: 1
  voice_name: ""

# Build settings
markdown: kramdown
permalink: pretty

# Sass/SCSS settings
sass:
  sass_dir: assets/css
  style: compressed

author: Shachar Mirkin

github_username: shacharmirkin
goatcounter_code: alpinf

twitter:
  username: shacharmirkin
  card: summary

social:
  name: Shachar Mirkin
  links:
    - https://twitter.com/shacharmirkin
    - https://github.com/shacharmirkin
    - https://www.linkedin.com/public-profile/in/shacharmirkin

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-sass-converter

# Example (syntax might vary based on theme)
header_pages:
  - index.md
  - snippets.md
  - research.md
  - contact.md

include:
  - .well-known
  - llms.txt
  - robots.txt
  # No front matter → static file (not a Jekyll page).
  - agent-index.md

# Keep thesis PDF downloadable but out of the HTML sitemap.
defaults:
  - scope:
      path: "assets/papers"
    values:
      sitemap: false

# Do not copy tooling into the published site (see README).
exclude:
  - tools
  - report
  - tests
  - sandbox
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - uv.lock
  - README.md
  - AGENTS.md
  - SECURITY.md
  - .pre-commit-config.yaml
