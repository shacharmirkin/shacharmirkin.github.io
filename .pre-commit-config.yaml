repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]

  - repo: local
    hooks:
      - id: block-sandbox-commits
        name: block sandbox files from commit
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -q "^sandbox/"; then
          echo "ERROR: sandbox files are staged. Remove them before committing.";
          git diff --cached --name-only | grep "^sandbox/"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: jekyll-rake-test
        name: jekyll build + HTMLProofer
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && bundle exec rake test'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pa11y-a11y
        name: pa11y accessibility (WCAG2AA)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/tools/a11y" && npm ci && npm run a11y'
        language: system
        pass_filenames: false
        stages: [pre-push]
